name: Build e Deploy TramaSul para EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      # 1. Baixa o código do repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Faz login no Docker Hub
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Constrói e envia a nova imagem para o Docker Hub apontando para a subpasta
      - name: Build e Push para Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ./case1_tramasul
          push: true
          tags: dgoes/tramasul:latest

      # 4. Conecta na EC2 via SSH e atualiza o container
      - name: Deploy na AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull dgoes/tramasul:latest
            sudo docker stop tramasul || true
            sudo docker rm tramasul || true
            sudo docker run -d -p 80:80 --restart always --name tramasul dgoes/tramasul:latest
            sudo docker image prune -f